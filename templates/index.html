<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网络性能监控</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1 class="text-center mb-4">网络性能监控</h1>
        
        <div class="row mb-4">
            <div class="col">
                <div class="input-group">
                    <input type="text" id="target-ip" class="form-control" placeholder="输入目标IP地址">
                    <button class="btn btn-primary" id="start-btn">开始监控</button>
                    <button class="btn btn-danger" id="stop-btn" disabled>停止监控</button>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6">
                <div class="card mb-4">
                    <div class="card-header">网络���迟</div>
                    <div class="card-body">
                        <canvas id="latencyChart"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card mb-4">
                    <div class="card-header">WiFi信号质量</div>
                    <div class="card-body">
                        <canvas id="wifiChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6">
                <div class="card mb-4">
                    <div class="card-header">网络吞吐量</div>
                    <div class="card-body">
                        <canvas id="throughputChart"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card mb-4">
                    <div class="card-header">丢包统计</div>
                    <div class="card-body">
                        <canvas id="packetLossChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.socket.io/4.0.1/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
